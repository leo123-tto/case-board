name: Build Windows

# Public source is already the sanitized free edition. This workflow checks out an exact
# release tag, bundles the pinned Pi Runtime, installs the NSIS package, and smoke-tests it.
# Updater signatures are generated locally after the artifact is downloaded; signing keys
# never enter GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Release tag to build, for example v0.4.15"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: caseboard-windows-public
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Verify release ref and version
        shell: pwsh
        run: |
          $expected = "${{ inputs.release_ref }}"
          if ($expected -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "release_ref must be a three-part SemVer tag: $expected"
            exit 1
          }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne $expected) {
            Write-Error "package.json version v$version does not match $expected"
            exit 1
          }
          git describe --tags --exact-match HEAD

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: dtolnay/rust-toolchain@stable

      # Cargo is a workspace, so its shared target directory is at repository root.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          Push-Location sidecars/pi-runtime
          bun install --frozen-lockfile --ignore-scripts
          Pop-Location

      - name: Disable updater artifacts before local signing
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8

      - name: Build Windows installer (NSIS .exe)
        env:
          CASEBOARD_TELEMETRY_URL: ${{ vars.CASEBOARD_TELEMETRY_URL }}
          CASEBOARD_TELEMETRY_KEY: ${{ vars.CASEBOARD_TELEMETRY_KEY }}
        run: pnpm tauri build --bundles nsis

      - name: Verify packaged Pi Runtime
        shell: pwsh
        run: |
          pnpm verify:pi-runtime-bundle --bundle-dir sidecars/pi-runtime/dist/bundle
          $installer = Get-ChildItem target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { Write-Error "NSIS installer not found"; exit 1 }
          $listing = (& 7z l $installer.FullName) -join "`n"
          foreach ($required in @(
            "caseboard-pi-runtime.exe",
            "runtime-metadata.json",
            "THIRD_PARTY_NOTICES.txt"
          )) {
            if ($listing -notmatch [regex]::Escape($required)) {
              Write-Error "NSIS installer is missing Pi Runtime resource: $required"
              exit 1
            }
          }

      - name: Install packaged app and verify Pi Runtime
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { Write-Error "NSIS installer not found"; exit 1 }
          $installDir = Join-Path $env:RUNNER_TEMP "caseboard-installed-pi-runtime"
          $install = Start-Process -FilePath $installer.FullName -PassThru -Wait `
            -ArgumentList @("/S", "/D=$installDir")
          if ($install.ExitCode -ne 0) {
            Write-Error "NSIS silent install failed with exit code $($install.ExitCode)"
            exit 1
          }
          pnpm verify:pi-runtime-bundle `
            --bundle-dir "$env:RUNNER_TEMP/caseboard-installed-pi-runtime/pi-runtime"

      - name: Smoke run (catch startup crash)
        shell: pwsh
        run: |
          Get-ChildItem target/release -Filter *.exe | ForEach-Object { Write-Host "exe: $($_.Name)" }
          $cand = @("target/release/caseboard.exe", "target/release/案件看板.exe") | Where-Object { Test-Path $_ }
          if (-not $cand) {
            $cand = Get-ChildItem target/release -Filter *.exe |
              Where-Object { $_.Name -notmatch "setup|uninstall" } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          $exe = $cand | Select-Object -First 1
          if (-not $exe) { Write-Error "no runnable exe found in target/release"; exit 1 }
          $p = Start-Process -FilePath $exe -PassThru `
                 -RedirectStandardError smoke-err.txt -RedirectStandardOutput smoke-out.txt
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Write-Host "APP EXITED EARLY (code $($p.ExitCode))"
            Get-Content smoke-err.txt -ErrorAction SilentlyContinue
            Get-Content smoke-out.txt -ErrorAction SilentlyContinue
            Get-Content "$env:APPDATA/CaseBoard/data/crash.log" -ErrorAction SilentlyContinue
            exit 1
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke OK - app alive after 12s"
          Get-Content smoke-err.txt -ErrorAction SilentlyContinue | Select-Object -First 40

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: caseboard-windows-exe-${{ inputs.release_ref }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
