name: Build Public Release (3 Platforms)

# Public repository only: compile Apple Silicon, Intel and Windows on GitHub-hosted
# runners. The private repository keeps this file as the sync source, but every job
# is guarded so it cannot consume private-repository Actions minutes.
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Release tag to build, for example v0.4.15"
        required: true
        type: string
      build_scope:
        description: "Build all platforms, or only the missing Intel package"
        required: true
        default: all
        type: choice
        options:
          - all
          - intel-only

permissions:
  contents: read

concurrency:
  group: caseboard-public-release-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify trusted release source
    if: github.repository == 'leo123-tto/case-board'
    runs-on: ubuntu-latest
    outputs:
      mac_matrix: ${{ steps.select_platforms.outputs.mac_matrix }}
      build_windows: ${{ steps.select_platforms.outputs.build_windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify tag, version and build-only delta
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release_ref must be a three-part SemVer tag: $RELEASE_REF" >&2
            exit 1
          }
          git rev-parse --verify "refs/tags/$RELEASE_REF^{commit}" >/dev/null
          VERSION="$(node -p "require('./package.json').version")"
          [ "v$VERSION" = "$RELEASE_REF" ] || {
            echo "package.json version v$VERSION does not match $RELEASE_REF" >&2
            exit 1
          }

          TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_REF^{commit}")"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "Building a post-tag release-tooling commit; checking its delta:"
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                .github/workflows/build-public-release.yml|scripts/build-pi-runtime.mjs|scripts/release.sh|scripts/verify-bundled-pi-runtime.mjs)
                  echo "  allowed: $path"
                  ;;
                *)
                  echo "unexpected post-tag application change: $path" >&2
                  exit 1
                  ;;
              esac
            done < <(git diff --name-only "$TAG_SHA"..HEAD)
          fi

      - name: Select requested platforms
        id: select_platforms
        shell: bash
        env:
          BUILD_SCOPE: ${{ inputs.build_scope }}
        run: |
          set -euo pipefail
          case "$BUILD_SCOPE" in
            all)
              echo 'mac_matrix={"include":[{"label":"Apple Silicon","runner":"macos-15","release_arch":"aarch64","file_arch":"aarch64","rust_target":"aarch64-apple-darwin","pi_target":"bun-darwin-arm64","expected_macho":"arm64","bundle_root":"target/release/bundle"},{"label":"Intel","runner":"macos-15-intel","release_arch":"x86_64","file_arch":"x64","rust_target":"x86_64-apple-darwin","pi_target":"bun-darwin-x64-baseline","expected_macho":"x86_64","bundle_root":"target/x86_64-apple-darwin/release/bundle"}]}' >> "$GITHUB_OUTPUT"
              echo 'build_windows=true' >> "$GITHUB_OUTPUT"
              ;;
            intel-only)
              echo 'mac_matrix={"include":[{"label":"Intel","runner":"macos-15-intel","release_arch":"x86_64","file_arch":"x64","rust_target":"x86_64-apple-darwin","pi_target":"bun-darwin-x64-baseline","expected_macho":"x86_64","bundle_root":"target/x86_64-apple-darwin/release/bundle"}]}' >> "$GITHUB_OUTPUT"
              echo 'build_windows=false' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unsupported build_scope: $BUILD_SCOPE" >&2
              exit 1
              ;;
          esac

  build-macos:
    name: Build macOS ${{ matrix.label }}
    needs: verify-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-release.outputs.mac_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: public-${{ matrix.file_arch }}

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          (
            cd sidecars/pi-runtime
            bun install --frozen-lockfile --ignore-scripts
          )

      - name: Build signed updater and DMG
        env:
          CI: "true"
          CASEBOARD_BUILD_EDITION: free
          CASEBOARD_NO_REVEAL: "1"
          CASEBOARD_PI_RUNTIME_TARGET: ${{ matrix.pi_target }}
          CASEBOARD_TELEMETRY_URL: ${{ vars.CASEBOARD_TELEMETRY_URL }}
          CASEBOARD_TELEMETRY_KEY: ${{ vars.CASEBOARD_TELEMETRY_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/release.sh "${{ matrix.release_arch }}"

      - name: Verify architecture, Pi Runtime and mounted DMG
        shell: bash
        env:
          BUNDLE_ROOT: ${{ matrix.bundle_root }}
          FILE_ARCH: ${{ matrix.file_arch }}
          EXPECTED_MACHO: ${{ matrix.expected_macho }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_REF#v}"
          APP="$BUNDLE_ROOT/macos/案件看板.app"
          UPDATER="$BUNDLE_ROOT/macos/案件看板.app.tar.gz"
          DMG="$BUNDLE_ROOT/dmg/案件看板_${VERSION}_${FILE_ARCH}.dmg"
          PI="$APP/Contents/Resources/pi-runtime/caseboard-pi-runtime"

          test -s "$DMG"
          test -s "$UPDATER"
          test -s "$UPDATER.sig"
          file "$APP/Contents/MacOS/caseboard" | tee app-architecture.txt
          file "$PI" | tee pi-architecture.txt
          grep -Fq "$EXPECTED_MACHO" app-architecture.txt
          grep -Fq "$EXPECTED_MACHO" pi-architecture.txt
          codesign --verify --strict "$PI"
          pnpm verify:pi-runtime-bundle             --bundle-dir "$APP/Contents/Resources/pi-runtime"             --updater "$UPDATER"

          MOUNT="$RUNNER_TEMP/caseboard-dmg-${FILE_ARCH}"
          mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          test -d "$MOUNT/案件看板.app"
          test -s "$MOUNT/请先阅读.txt"
          hdiutil detach "$MOUNT" -quiet
          trap - EXIT

          mkdir -p release-assets
          cp "$DMG" "$UPDATER" "$UPDATER.sig" release-assets/
          (
            cd release-assets
            shasum -a 256 * > "checksums-macos-${FILE_ARCH}.txt"
          )

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caseboard-macos-${{ matrix.file_arch }}-${{ inputs.release_ref }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build Windows x64
    needs: verify-release
    if: needs.verify-release.outputs.build_windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: public-windows-x64

      - name: Install dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          Push-Location sidecars/pi-runtime
          bun install --frozen-lockfile --ignore-scripts
          Pop-Location

      - name: Disable updater artifacts before local signature
        shell: pwsh
        run: |
          $path = "src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding utf8

      - name: Build NSIS installer
        env:
          CASEBOARD_BUILD_EDITION: free
          CASEBOARD_TELEMETRY_URL: ${{ vars.CASEBOARD_TELEMETRY_URL }}
          CASEBOARD_TELEMETRY_KEY: ${{ vars.CASEBOARD_TELEMETRY_KEY }}
        run: pnpm tauri build --bundles nsis

      - name: Verify packaged and installed Pi Runtime
        shell: pwsh
        run: |
          pnpm verify:pi-runtime-bundle --bundle-dir sidecars/pi-runtime/dist/bundle
          $installer = Get-ChildItem target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer) { Write-Error "NSIS installer not found"; exit 1 }

          $listing = (& 7z l $installer.FullName) -join "`n"
          foreach ($required in @(
            "caseboard-pi-runtime.exe",
            "runtime-metadata.json",
            "THIRD_PARTY_NOTICES.txt"
          )) {
            if ($listing -notmatch [regex]::Escape($required)) {
              Write-Error "NSIS installer is missing Pi Runtime resource: $required"
              exit 1
            }
          }

          $installDir = Join-Path $env:RUNNER_TEMP "caseboard-installed"
          $install = Start-Process -FilePath $installer.FullName -PassThru -Wait `
            -ArgumentList @("/S", "/D=$installDir")
          if ($install.ExitCode -ne 0) {
            Write-Error "NSIS install failed with exit code $($install.ExitCode)"
            exit 1
          }
          pnpm verify:pi-runtime-bundle --bundle-dir "$installDir/pi-runtime"

      - name: Smoke run
        shell: pwsh
        run: |
          $cand = @("target/release/caseboard.exe", "target/release/案件看板.exe") |
            Where-Object { Test-Path $_ }
          if (-not $cand) {
            $cand = Get-ChildItem target/release -Filter *.exe |
              Where-Object { $_.Name -notmatch "setup|uninstall" } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          $exe = $cand | Select-Object -First 1
          if (-not $exe) { Write-Error "no runnable exe found"; exit 1 }
          $process = Start-Process -FilePath $exe -PassThru `
            -RedirectStandardError smoke-err.txt -RedirectStandardOutput smoke-out.txt
          Start-Sleep -Seconds 12
          if ($process.HasExited) {
            Get-Content smoke-err.txt -ErrorAction SilentlyContinue
            Get-Content smoke-out.txt -ErrorAction SilentlyContinue
            exit 1
          }
          Stop-Process -Id $process.Id -Force

      - name: Prepare Windows artifact
        shell: pwsh
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          $version = $env:RELEASE_REF.TrimStart("v")
          $installer = Get-ChildItem target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $destination = "release-assets/案件看板_${version}_x64-setup.exe"
          Copy-Item $installer.FullName $destination
          $hash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLower()
          "$hash  案件看板_${version}_x64-setup.exe" | Set-Content release-assets/checksums-windows-x64.txt

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: caseboard-windows-x64-${{ inputs.release_ref }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
